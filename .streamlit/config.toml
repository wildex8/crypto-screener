# Streamlit settings for the Trade Screener: a clean, iOS-style dark look.

[theme]
base = "dark"
primaryColor = "#0A84FF"          # iOS blue - the one accent colour
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
